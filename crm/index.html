:root{
  --ink:#0b0b0e; --paper:#faf9f6; --paper-dim:#efeee9;
  --accent:#ff4d2e; --accent-deep:#c4310e;
  --line:rgba(11,11,14,.12); --line-mid:rgba(11,11,14,.26); --muted:rgba(11,11,14,.64);
  --display:"Unbounded","Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Arial,sans-serif;
  --s-nuevo:#ff4d2e; --s-contactado:#b7791f; --s-propuesta:#2b6cb0; --s-ganado:#2f855a; --s-perdido:#6b6b73;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
.hidden{display:none!important}

.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:26px;width:auto;display:block}
.brand em{font:700 13px var(--display);letter-spacing:.14em;border:1px solid var(--accent);border-radius:999px;padding:3px 10px}
.login .brand .logo{height:46px}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;display:grid;gap:14px}
.login h1{font-size:34px;margin-bottom:4px}
.login h1 em{font-style:normal;color:var(--accent)}
.err{color:var(--accent-deep);font-size:13.5px;min-height:20px;margin:0}

.field{display:grid;gap:6px}
.field label{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
input,select,textarea{border:1px solid var(--line-mid);border-radius:8px;padding:10px 12px;background:#fff;width:100%}
textarea{resize:vertical;min-height:70px}
.btn{border:1px solid transparent;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font:600 14px var(--display);cursor:pointer;transition:background .2s}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-mid)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}

/* App */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(250,249,246,.92);backdrop-filter:blur(10px);z-index:20}
header.top h1{font-size:22px}
header.top h1 em{font-style:normal;color:var(--accent)}
.who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
main{padding:clamp(16px,3vw,32px);max-width:1280px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border-top:1px solid var(--line-mid);margin-bottom:22px}
.stat{padding:16px 16px 14px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;position:relative}
.stat::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.stat.on::after,.stat:hover::after{transform:scaleX(1)}
.stat b{display:block;font:700 30px var(--display);letter-spacing:-.03em}
.stat span{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input{max-width:280px}
.filters select{width:auto}

table{width:100%;border-collapse:collapse}
th{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-mid)}
td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer;transition:background .2s}
tr.row:hover{background:rgba(11,11,14,.035)}
tr.row:focus-visible{outline-offset:-2px}
.nm{font:600 15px var(--display)}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--display);padding:4px 11px;border:1px solid var(--line-mid);border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c,#999)}
.src{font:600 12px var(--display);color:var(--muted)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(11,11,14,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);z-index:50;overflow:auto;padding:24px;box-shadow:-12px 0 40px rgba(0,0,0,.15);display:grid;gap:20px;align-content:start}
.drawer h2{font-size:28px}
.close{justify-self:end;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);font:600 11px var(--display);text-transform:uppercase;letter-spacing:.1em;padding-top:3px}
.kv dd{margin:0;word-break:break-word}
.kv a{text-decoration:underline}
.msg{white-space:pre-wrap;background:var(--paper-dim);border-radius:10px;padding:14px;font-size:14.5px}
.sec h3{font-size:16px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line-mid)}
.note{padding:10px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;font-size:14px}
.note small,.ev{color:var(--muted);font-size:12.5px;display:block}
.ev{padding:4px 0}
.statusrow{display:flex;gap:8px;flex-wrap:wrap}
.statusrow button{border:1px solid var(--line-mid);background:#fff;border-radius:999px;padding:6px 14px;font:600 13px var(--display);cursor:pointer}
.statusrow button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:90}


/* Vistas, dashboard y pipeline */
.tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font:600 14px var(--display);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.dhead h2{font-size:22px}.dhead select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi span{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.kpi b{display:block;font:700 28px var(--display);letter-spacing:-.03em;margin:4px 0 2px}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi small.up{color:var(--s-ganado)}.kpi small.down{color:var(--accent-deep)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;grid-column:span 6;min-width:0}
.card.w8{grid-column:span 8}.card.w4{grid-column:span 4}.card.w12{grid-column:span 12}
.card h3{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:14px}
@media (max-width:900px){.card,.card.w8,.card.w4{grid-column:span 12}}
.chart{width:100%;height:auto;display:block}
.ax{font:10px var(--body);fill:rgba(11,11,14,.5)}
.donut{width:140px;height:140px;flex:none}.dn{font:700 24px var(--display)}.ds{font:11px var(--body);fill:rgba(11,11,14,.55)}
.dwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.leg{display:grid;gap:7px;font-size:13.5px;flex:1;min-width:140px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.hb{display:grid;grid-template-columns:minmax(80px,36%) 1fr 34px;gap:10px;align-items:center;margin:10px 0;font-size:13.5px}
.tr{height:10px;background:var(--paper-dim);border-radius:99px;overflow:hidden}.tr i{display:block;height:100%;border-radius:99px}
.hb b{text-align:right;font-family:var(--display)}
.mini th,.mini td{padding:8px 6px;font-size:13.5px}.mini tr[data-id]{cursor:pointer}.mini tr[data-id]:hover{background:rgba(11,11,14,.035)}
.late{color:var(--accent-deep);font-weight:600}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--paper-dim);border-radius:14px;padding:12px;min-height:260px;display:grid;gap:8px;align-content:start}
.col.over{outline:2px dashed var(--accent)}
.colh{display:flex;justify-content:space-between;align-items:center}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:grab}.kc.drag{opacity:.4}
.kmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}

/* Shell tipo dashboard */
body{background:#f4f4f1}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.side .brand{padding:0 8px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;font:600 14px var(--display);color:var(--muted);cursor:pointer;text-align:left;white-space:nowrap}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--paper-dim)}
.nav button.on{background:rgba(255,77,46,.1);color:var(--accent-deep)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--muted)}
.me #who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .btn{padding:5px 12px;font-size:12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 13px var(--display);font-style:normal;flex:none}
.content{min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,32px);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h2{font-size:22px;margin-right:auto}
.gsearch{flex:0 1 300px;border-radius:999px;background:var(--paper)}
.upd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--s-ganado);white-space:nowrap}
.upd i{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn.acc{background:var(--accent)}.btn.acc:hover{background:var(--accent-deep)}
main{max-width:none;margin:0}
.kpi,.card{border-radius:16px;box-shadow:0 1px 2px rgba(11,11,14,.04)}
.kh{display:flex;align-items:center;gap:10px}
.ico{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;flex:none}
.ico svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.kpi b{margin:12px 0 6px}
.chip{font:600 11.5px var(--display);padding:2px 8px;border-radius:99px}
.chip.up{background:rgba(47,133,90,.12);color:var(--s-ganado)}.chip.down{background:rgba(196,49,14,.12);color:var(--accent-deep)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.lbl{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.big{font:700 30px var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:10px;margin-top:2px}
.pls{display:flex;gap:2px;background:var(--paper-dim);border-radius:10px;padding:3px}
.pl{border:0;background:none;padding:5px 11px;border-radius:8px;font:600 12px var(--display);color:var(--muted);cursor:pointer}
.pl.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bars{display:flex;align-items:stretch;gap:5px;height:210px}
.bcol{flex:1;position:relative;background:var(--paper-dim);border-radius:8px;display:flex;align-items:flex-end;min-width:0}
.bcol i{display:block;width:100%;background:rgba(255,77,46,.35);border-radius:8px;transition:background .2s}
.bcol.max i,.bcol:hover i{background:var(--accent)}
.bcol:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px 10px;border-radius:8px;font:600 12px var(--display);white-space:nowrap;z-index:5}
.bx{display:flex;gap:5px;margin-top:8px}
.bx span{flex:1;min-width:0;display:flex;justify-content:center;font-size:10.5px;color:var(--muted);white-space:nowrap}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calh button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer}
.calh b{font:600 14px var(--display);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
.cal i{font-style:normal;padding:6px 0;border-radius:50%;position:relative}
.cal .dow{color:var(--muted);font-size:11px}
.cal .today{background:var(--accent);color:#fff;font-weight:600}
.cal .mk::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cal .today.mk::after{background:#fff}
.nx{margin-top:10px}
.nr{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.nr:hover{background:rgba(11,11,14,.03)}
.warn{margin:14px 0 0;padding:8px 12px;background:rgba(255,77,46,.08);color:var(--accent-deep);border-radius:10px;font-size:12.5px}
.filters{margin-bottom:12px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .nav{display:flex;gap:2px;order:3;width:100%;overflow-x:auto}
  .me{margin:0 0 0 auto;border:0;padding:0}.me #who{display:none}
  .topbar{flex-wrap:wrap}.topbar h2{width:100%}.gsearch{flex:1 1 100%}.upd{display:none}
}

@media (max-width:760px){
  th.hide-m,td.hide-m{display:none}
  .kv{grid-template-columns:1fr}
}

/* Ajustes para Unbounded (tipografía ancha): tamaños más contenidos */
h1,h2,h3{letter-spacing:-.01em;font-weight:600}
.topbar h2{font-size:17px}
.nav button{font-size:12.5px}
.kpi b,.stat b{font-size:22px;letter-spacing:-.02em}
.big{font-size:24px;letter-spacing:-.02em}
.kpi span,.lbl,.card h3,.stat span,th,.field label,.kv dt{font-size:10px;letter-spacing:.07em}
.btn{font-size:12.5px;padding:10px 18px}
.me .btn{font-size:11px;padding:5px 12px}
.pill,.pl,.statusrow button,.src{font-size:11px}
.chip{font-size:10.5px}
.nm{font-size:13.5px}
.calh b{font-size:13px}
.dn{font-size:19px}
.brand em{font-size:11px}
.drawer h2{font-size:22px}
.login h1{font-size:26px}
.hb{font-size:12.5px}
.mini th,.mini td{font-size:12.5px}

/* Correcciones de ajuste */
.side .brand{flex-direction:column;align-items:flex-start;gap:8px}
.side .brand .logo{height:24px;max-width:100%}
.login .brand{flex-direction:column;align-items:flex-start;gap:10px}
.bx span:first-child{justify-content:flex-start}
.bx span:last-child{justify-content:flex-end}
.calh b{text-transform:none}
.calh b::first-letter{text-transform:uppercase}
@media (max-width:900px){.side .brand{flex-direction:row;align-items:center}}
</style>

      <button id="t-board" data-v="board" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>Pipeline</button>
      <button id="t-leads" data-v="leads" type="button"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Leads</button>
    </nav>
    <div class="me"><i class="av" id="av"></i><span id="who"></span><button class="btn ghost" id="logout" type="button">Salir</button></div>
  </aside>
  <div class="content">
    <header class="topbar">
      <h2 id="pageTitle">Resumen</h2>
      <input id="q" class="gsearch" type="search" placeholder="Buscar nombre, correo, empresa…" aria-label="Buscar">
      <span class="upd"><i></i><span id="upd">Actualizado</span></span>
      <button class="btn ghost" id="csvBtn" type="button">Exportar CSV</button>
      <button class="btn acc" id="addBtn" type="button">+ Lead manual</button>
    </header>
    <main>
      <section id="v-dash">
        <div class="kpis" id="kpis"></div>
        <div class="grid" id="dashGrid"></div>
      </section>
      <section id="v-board" class="hidden"><div class="board" id="board"></div></section>
      <section id="v-leads" class="hidden">
        <div class="stats" id="stats"></div>
        <div class="filters">
          <select id="fSource" aria-label="Origen">
            <option value="">Todos los orígenes</option>
            <option value="web">Web</option>
            <option value="meta_ads">Meta Ads</option>
            <option value="manual">Manual</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="card w12" style="padding:6px 14px">
        <table>
          <thead><tr>
            <th>Lead</th><th class="hide-m">Interés</th><th>Estado</th><th class="hide-m">Origen</th><th>Fecha</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty hidden" id="empty">No hay leads con estos filtros.</div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="drawerHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var cfg = window.CRM_CONFIG;
  var sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  var STATUSES = ['nuevo', 'contactado', 'propuesta', 'ganado', 'perdido'];
  var LABEL = { nuevo: 'Nuevo', contactado: 'Contactado', propuesta: 'Propuesta', ganado: 'Ganado', perdido: 'Perdido' };
  var SRC = { web: 'Web', meta_ads: 'Meta Ads', manual: 'Manual', otro: 'Otro' };

  var leads = [];
  var fStatus = '';
  var $ = function (id) { return document.getElementById(id); };

  /* Todo dato de un lead es NO confiable (lo escribe cualquiera desde un
     formulario público). Nunca se inserta como HTML: siempre se escapa. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(d) {
    return new Date(d).toLocaleString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function toast(t) {
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = t;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2400);
  }
  function pill(s) {
    return '<span class="pill" style="--c:var(--s-' + esc(s) + ')"><i></i>' + esc(LABEL[s] || s) + '</span>';
  }
  function safeTel(p) { return String(p || '').replace(/[^\d+]/g, ''); }

  /* ---------- Sesión ---------- */
  async function boot() {
    var res = await sb.auth.getSession();
    if (res.data.session) await enter(res.data.session.user);
  }
  async function enter(user) {
    // ¿Es miembro del equipo? Si no, RLS devolverá 0 filas.
    var t = await sb.from('team_members').select('role').eq('user_id', user.id).maybeSingle();
    if (!t.data) {
      await sb.auth.signOut();
      $('loginErr').textContent = 'Tu usuario existe pero no tiene acceso al CRM. Pide que te agreguen al equipo.';
      return;
    }
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('who').textContent = user.email;
    $('av').textContent = user.email.charAt(0).toUpperCase();
    await load();
    sb.channel('leads-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, function (p) {
        if (p.eventType === 'INSERT') toast('Nuevo lead: ' + (p.new.name || p.new.email || 'sin nombre'));
        load();
      }).subscribe();
  }
  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('loginErr').textContent = '';
    var r = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (r.error) { $('loginErr').textContent = 'Correo o contraseña incorrectos.'; return; }
    await enter(r.data.user);
  });
  $('logout').addEventListener('click', async function () { await sb.auth.signOut(); location.reload(); });

  /* ---------- Datos ---------- */
  async function load() {
    var r = await sb.from('leads').select('*').order('created_at', { ascending: false }).limit(1000);
    if (r.error) { toast('Error al cargar leads'); return; }
    leads = r.data;
    $('upd').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    render(); renderDash(); renderBoard();
  }

  function filtered() {
    var q = $('q').value.trim().toLowerCase();
    var src = $('fSource').value;
    return leads.filter(function (l) {
      if (fStatus && l.status !== fStatus) return false;
      if (src && l.source !== src) return false;
      if (!q) return true;
      return [l.name, l.email, l.company, l.phone, l.message].join(' ').toLowerCase().indexOf(q) > -1;
    });
  }

  function render() {
    // Contadores (clic = filtrar por estado)
    var counts = {};
    STATUSES.forEach(function (s) { counts[s] = 0; });
    leads.forEach(function (l) { counts[l.status] = (counts[l.status] || 0) + 1; });
    var html = '<button class="stat' + (fStatus === '' ? ' on' : '') + '" data-s=""><b>' + leads.length + '</b><span>Todos</span></button>';
    STATUSES.forEach(function (s) {
      html += '<button class="stat' + (fStatus === s ? ' on' : '') + '" data-s="' + s + '"><b>' + counts[s] + '</b><span>' + LABEL[s] + '</span></button>';
    });
    $('stats').innerHTML = html;

    var list = filtered();
    $('empty').classList.toggle('hidden', list.length > 0);
    $('rows').innerHTML = list.map(function (l) {
      return '<tr class="row" tabindex="0" data-id="' + esc(l.id) + '">' +
        '<td><div class="nm">' + esc(l.name || '(sin nombre)') + '</div><div class="sub">' + esc(l.email || l.phone || '') + (l.company ? ' · ' + esc(l.company) : '') + '</div></td>' +
        '<td class="hide-m">' + esc(l.service || '—') + '</td>' +
        '<td>' + pill(l.status) + '</td>' +
        '<td class="hide-m"><span class="src">' + esc(SRC[l.source] || l.source) + '</span></td>' +
        '<td class="sub">' + esc(fmt(l.created_at)) + '</td></tr>';
    }).join('');
  }

  $('stats').addEventListener('click', function (e) {
    var b = e.target.closest('[data-s]'); if (!b) return;
    fStatus = b.getAttribute('data-s'); render();
  });
  $('q').addEventListener('input', function () { setView('leads'); render(); });
  $('fSource').addEventListener('change', render);
  function openRow(e) {
    var tr = e.target.closest('tr.row'); if (!tr) return;
    openLead(tr.getAttribute('data-id'));
  }
  $('rows').addEventListener('click', openRow);
  $('rows').addEventListener('keydown', function (e) { if (e.key === 'Enter') openRow(e); });

  /* ---------- Detalle ---------- */
  function closeDrawer() { $('drawerHost').innerHTML = ''; }

  async function openLead(id) {
    var lead = leads.filter(function (l) { return l.id === id; })[0];
    if (!lead) return;
    var [notes, events] = await Promise.all([
      sb.from('lead_notes').select('*').eq('lead_id', id).order('created_at', { ascending: false }),
      sb.from('lead_events').select('*').eq('lead_id', id).order('created_at', { ascending: false }).limit(30)
    ]);

    var rows = [
      ['Correo', lead.email ? '<a href="mailto:' + esc(lead.email) + '">' + esc(lead.email) + '</a>' : '—'],
      ['Teléfono', lead.phone ? '<a href="tel:' + esc(safeTel(lead.phone)) + '">' + esc(lead.phone) + '</a> · <a target="_blank" rel="noopener noreferrer" href="https://wa.me/' + esc(safeTel(lead.phone).replace('+', '')) + '">WhatsApp</a>' : '—'],
      ['Empresa', esc(lead.company || '—')],
      ['Interés', esc(lead.service || '—')],
      ['Origen', esc(SRC[lead.source] || lead.source) + (lead.lang ? ' · ' + esc(lead.lang.toUpperCase()) : '')],
      ['Campaña', esc([lead.utm_source, lead.utm_medium, lead.utm_campaign].filter(Boolean).join(' / ') || (lead.meta_campaign_id ? 'Meta ' + lead.meta_campaign_id : '—'))],
      ['Página', esc(lead.landing_page || '—')],
      ['Recibido', esc(fmt(lead.created_at))]
    ].map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('');

    var evText = function (ev) {
      if (ev.kind === 'created') return 'Lead creado';
      if (ev.kind === 'status_changed') return 'Estado: ' + (LABEL[ev.detail.from] || ev.detail.from) + ' → ' + (LABEL[ev.detail.to] || ev.detail.to);
      if (ev.kind === 'note_added') return 'Nota agregada';
      return ev.kind;
    };

    $('drawerHost').innerHTML =
      '<div class="scrim" id="scrim"></div>' +
      '<aside class="drawer" role="dialog" aria-modal="true" aria-label="Detalle del lead">' +
      '<button class="close" id="closeD" aria-label="Cerrar">×</button>' +
      '<div><h2>' + esc(lead.name || '(sin nombre)') + '</h2></div>' +
      '<div class="statusrow" id="statusRow">' + STATUSES.map(function (s) {
        return '<button type="button" data-st="' + s + '" class="' + (lead.status === s ? 'on' : '') + '">' + LABEL[s] + '</button>';
      }).join('') + '</div>' +
      '<div class="sec"><h3>Seguimiento</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
        '<div class="field"><label for="fuV">Valor estimado (COP)</label><input id="fuV" type="number" min="0" step="1000" value="' + esc(lead.value_cop || '') + '"></div>' +
        '<div class="field"><label for="fuD">Próxima acción</label><input id="fuD" type="datetime-local" value="' + esc(lead.next_action_at ? toLocal(lead.next_action_at) : '') + '"></div></div>' +
        '<p><button class="btn ghost" id="fuBtn" type="button">Guardar seguimiento</button></p></div>' +
      '<dl class="kv">' + rows + '</dl>' +
      (lead.message ? '<div class="sec"><h3>Mensaje</h3><div class="msg">' + esc(lead.message) + '</div></div>' : '') +
      '<div class="sec"><h3>Notas</h3>' +
        '<div class="field"><textarea id="noteIn" placeholder="Escribe una nota…" aria-label="Nueva nota"></textarea></div>' +
        '<p><button class="btn" id="noteBtn" type="button">Guardar nota</button></p>' +
        '<div>' + (notes.data || []).map(function (n) {
          return '<div class="note">' + esc(n.body) + '<small>' + esc(fmt(n.created_at)) + '</small></div>';
        }).join('') + '</div></div>' +
      '<div class="sec"><h3>Historial</h3>' + (events.data || []).map(function (ev) {
        return '<span class="ev">' + esc(fmt(ev.created_at)) + ' — ' + esc(evText(ev)) + '</span>';
      }).join('') + '</div>' +
      '</aside>';

    $('scrim').onclick = closeDrawer;
    $('closeD').onclick = closeDrawer;
    $('closeD').focus();
    $('statusRow').onclick = async function (e) {
      var b = e.target.closest('[data-st]'); if (!b) return;
      var r = await sb.from('leads').update({ status: b.getAttribute('data-st') }).eq('id', id);
      if (r.error) { toast('No se pudo actualizar'); return; }
      toast('Estado actualizado');
      await load(); openLead(id);
    };
    $('fuBtn').onclick = async function () {
      var v = $('fuV').value, d = $('fuD').value;
      var r = await sb.from('leads').update({ value_cop: v === '' ? null : Math.round(+v), next_action_at: d ? new Date(d).toISOString() : null }).eq('id', id);
      if (r.error) { toast('No se pudo guardar'); return; }
      toast('Seguimiento guardado'); await load();
    };
    $('noteBtn').onclick = async function () {
      var body = $('noteIn').value.trim(); if (!body) return;
      var u = await sb.auth.getUser();
      var r = await sb.from('lead_notes').insert({ lead_id: id, body: body, author_id: u.data.user.id });
      if (r.error) { toast('No se pudo guardar la nota'); return; }
      openLead(id);
    };
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  /* ---------- Lead manual ---------- */
  $('addBtn').addEventListener('click', function () {
    $('drawerHost').innerHTML =
      '<div class="scrim" id="scrim"></div>' +
      '<aside class="drawer" role="dialog" aria-modal="true" aria-label="Nuevo lead">' +
      '<button class="close" id="closeD" aria-label="Cerrar">×</button><h2>Nuevo lead</h2>' +
      '<form id="mForm" style="display:grid;gap:14px">' +
      '<div class="field"><label for="mn">Nombre</label><input id="mn" required></div>' +
      '<div class="field"><label for="me">Correo</label><input id="me" type="email"></div>' +
      '<div class="field"><label for="mp">Teléfono</label><input id="mp"></div>' +
      '<div class="field"><label for="mc">Empresa</label><input id="mc"></div>' +
      '<div class="field"><label for="mm">Mensaje / contexto</label><textarea id="mm"></textarea></div>' +
      '<button class="btn" type="submit">Crear lead</button></form></aside>';
    $('scrim').onclick = closeDrawer; $('closeD').onclick = closeDrawer; $('mn').focus();
    $('mForm').onsubmit = async function (e) {
      e.preventDefault();
      var r = await sb.from('leads').insert({
        name: $('mn').value.trim(), email: $('me').value.trim().toLowerCase() || null,
        phone: $('mp').value.trim() || null, company: $('mc').value.trim() || null,
        message: $('mm').value.trim() || null, source: 'manual'
      });
      if (r.error) { toast('No se pudo crear'); return; }
      closeDrawer(); load();
    };
  });

  /* ---------- Exportar CSV ---------- */
  $('csvBtn').addEventListener('click', function () {
    var cols = ['created_at', 'name', 'email', 'phone', 'company', 'service', 'status', 'source', 'utm_source', 'utm_medium', 'utm_campaign', 'message'];
    // Neutraliza inyección de fórmulas en Excel/Sheets (=, +, -, @).
    var cell = function (v) {
      var s = String(v == null ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var csv = [cols.join(',')].concat(filtered().map(function (l) {
      return cols.map(function (c) { return cell(l[c]); }).join(',');
    })).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'leads-targett.csv';
    a.click();
  });

  /* ---------- Vistas: resumen y pipeline ---------- */
  var period = 30, DAY = 864e5;
  var COP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
  var COLORS = ['#ff4d2e', '#2b6cb0', '#2f855a', '#b7791f', '#6b6b73', '#8a4fff'];
  var OPEN = ['nuevo', 'contactado', 'propuesta'];
  function toLocal(d) { var x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); }
  function ago(d) { var n = Math.floor((Date.now() - new Date(d)) / DAY); return n < 1 ? 'hoy' : 'hace ' + n + ' d'; }
  function sumV(a) { return a.reduce(function (t, l) { return t + (+l.value_cop || 0); }, 0); }
  function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; }
  function countBy(arr, fn) {
    var m = {}; arr.forEach(function (l) { var k = fn(l); m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return { k: k, v: m[k] }; }).sort(function (a, b) { return b.v - a.v; });
  }
  function hbars(items, color) {
    var max = Math.max.apply(null, items.map(function (i) { return i.v; }).concat(1));
    if (!items.length) return '<p class="sub">Sin datos en este periodo.</p>';
    return items.map(function (it, i) {
      return '<div class="hb"><span>' + esc(it.label || it.k) + '</span><div class="tr"><i style="width:' + (it.v / max * 100) + '%;background:' + color(it, i) + '"></i></div><b>' + it.v + '</b></div>';
    }).join('');
  }
  function donut(items) {
    var tot = items.reduce(function (t, i) { return t + i.v; }, 0);
    if (!tot) return '<p class="sub">Sin datos en este periodo.</p>';
    var c = 2 * Math.PI * 52, off = 0;
    var svg = '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Leads por origen"><g transform="rotate(-90 70 70)">';
    items.forEach(function (it, i) {
      var len = it.v / tot * c;
      svg += '<circle cx="70" cy="70" r="52" fill="none" stroke="' + COLORS[i % 6] + '" stroke-width="22" stroke-dasharray="' + len + ' ' + (c - len) + '" stroke-dashoffset="' + (-off) + '"><title>' + esc(it.label) + ': ' + it.v + '</title></circle>';
      off += len;
    });
    svg += '</g><text x="70" y="68" text-anchor="middle" class="dn">' + tot + '</text><text x="70" y="84" text-anchor="middle" class="ds">leads</text></svg>';
    return '<div class="dwrap">' + svg + '<div class="leg">' + items.map(function (it, i) {
      return '<div><i style="background:' + COLORS[i % 6] + '"></i>' + esc(it.label) + ' · <b>' + it.v + '</b> (' + pct(it.v, tot) + ')</div>';
    }).join('') + '</div></div>';
  }
  var calOff = 0, mgmt = 'estado';
  var IC = {
    users: '<path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6M21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
    check: '<path d="M20 6L9 17l-5-5"/>'
  };
  function kpi(ic, l, v, extra) {
    return '<div class="kpi"><div class="kh"><i class="ico"><svg viewBox="0 0 24 24">' + IC[ic] + '</svg></i><span>' + l + '</span></div><b>' + v + '</b><div class="kf">' + (extra || '') + '</div></div>';
  }
  function chip(c, p, pts) {
    if (!period || !p) return '';
    var d = pts ? Math.round(c - p) : Math.round((c - p) / p * 100);
    return '<span class="chip ' + (d >= 0 ? 'up' : 'down') + '">' + (d >= 0 ? '▲' : '▼') + ' ' + Math.abs(d) + (pts ? ' pp' : '%') + '</span>';
  }
  function barChart(arr) {
    var days = period || 90, g = days > 31 ? 7 : 1, n = Math.ceil(days / g), b = [];
    for (var q = 0; q < n; q++) b.push(0);
    var end = new Date(); end.setHours(23, 59, 59, 999);
    arr.forEach(function (l) {
      var i = n - 1 - Math.floor(Math.floor((end - new Date(l.created_at)) / DAY) / g);
      if (i >= 0 && i < n) b[i]++;
    });
    var mx = Math.max.apply(null, b.concat(1)), top = b.indexOf(Math.max.apply(null, b)), step = Math.ceil(n / 8);
    var lab = function (i) { return new Date(end.getTime() - (n - 1 - i) * g * DAY).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }); };
    return '<div class="bars">' + b.map(function (v, i) {
      return '<div class="bcol' + (i === top && v ? ' max' : '') + '" data-t="' + esc(lab(i) + (g > 1 ? ' (sem.)' : '') + ': ' + v + (v === 1 ? ' lead' : ' leads')) + '"><i style="height:' + (v ? Math.max(v / mx * 100, 4) : 0) + '%"></i></div>';
    }).join('') + '</div><div class="bx">' + b.map(function (v, i) { return '<span>' + (i % step === 0 ? esc(lab(i)) : '') + '</span>'; }).join('') + '</div>';
  }
  function calendar() {
    var t = new Date(), base = new Date(t.getFullYear(), t.getMonth() + calOff, 1);
    var y = base.getFullYear(), m = base.getMonth(), first = (base.getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), mk = {};
    leads.forEach(function (l) {
      if (!l.next_action_at || OPEN.indexOf(l.status) < 0) return;
      var d = new Date(l.next_action_at);
      if (d.getFullYear() === y && d.getMonth() === m) mk[d.getDate()] = 1;
    });
    var h = '<div class="calh"><button type="button" data-cal="-1" aria-label="Mes anterior">‹</button><b>' + esc(base.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' })) + '</b><button type="button" data-cal="1" aria-label="Mes siguiente">›</button></div><div class="cal">';
    ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach(function (d) { h += '<i class="dow">' + d + '</i>'; });
    for (var i = 0; i < first; i++) h += '<i></i>';
    for (var d = 1; d <= dim; d++) {
      var isT = calOff === 0 && d === t.getDate();
      h += '<i class="' + (isT ? 'today' : '') + (mk[d] ? ' mk' : '') + '">' + d + '</i>';
    }
    return h + '</div>';
  }

  function renderDash() {
    var now = Date.now();
    var cur = leads.filter(function (l) { return !period || now - new Date(l.created_at) <= period * DAY; });
    var prev = period ? leads.filter(function (l) { var a = now - new Date(l.created_at); return a > period * DAY && a <= 2 * period * DAY; }) : [];
    var st = function (a, s) { return a.filter(function (l) { return l.status === s; }); };
    var rate = function (a) { var w = st(a, 'ganado').length, x = w + st(a, 'perdido').length; return x ? w / x * 100 : 0; };
    var wonC = st(cur, 'ganado'), lostC = st(cur, 'perdido');
    var open = leads.filter(function (l) { return OPEN.indexOf(l.status) > -1; });
    var stale = leads.filter(function (l) { return l.status === 'nuevo' && now - new Date(l.created_at) > DAY; }).length;
    var vs = '<small>' + (period ? 'vs periodo anterior' : 'todo el historial') + '</small>';

    $('kpis').innerHTML =
      kpi('users', 'Leads', cur.length, chip(cur.length, prev.length) + vs) +
      kpi('target', 'Tasa de cierre', pct(wonC.length, wonC.length + lostC.length), chip(rate(cur), rate(prev), 1) + '<small>' + wonC.length + ' ganados · ' + lostC.length + ' perdidos</small>') +
      kpi('trend', 'Pipeline abierto', esc(COP.format(sumV(open))), '<small>' + open.length + ' leads activos</small>') +
      kpi('check', 'Ganado', esc(COP.format(sumV(wonC))), chip(sumV(wonC), sumV(st(prev, 'ganado'))) + vs);

    var camp = {};
    cur.forEach(function (l) {
      var k = l.utm_campaign || (l.meta_campaign_id ? 'Meta ' + l.meta_campaign_id : '(directo / sin campaña)');
      var c = camp[k] || (camp[k] = { k: k, n: 0, w: 0 }); c.n++; if (l.status === 'ganado') c.w++;
    });
    var campRows = Object.keys(camp).map(function (k) { return camp[k]; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
    var next = leads.filter(function (l) { return l.next_action_at && OPEN.indexOf(l.status) > -1; })
      .sort(function (a, b) { return new Date(a.next_action_at) - new Date(b.next_action_at); }).slice(0, 3);
    var tot = cur.length;
    var pills = [[7, '7D'], [30, '30D'], [90, '90D'], [0, 'Todo']].map(function (x) {
      return '<button type="button" class="pl' + (period === x[0] ? ' on' : '') + '" data-p="' + x[0] + '">' + x[1] + '</button>';
    }).join('');
    var mItems = mgmt === 'estado'
      ? hbars(STATUSES.map(function (s) { var n = st(cur, s).length; return { k: s, label: LABEL[s] + ' · ' + pct(n, tot), v: n }; }), function (it) { return 'var(--s-' + it.k + ')'; })
      : hbars(countBy(cur, function (l) { return l.service || 'Sin especificar'; }), function (_, i) { return COLORS[i % 6]; });

    $('dashGrid').innerHTML =
      '<div class="card w8"><div class="ch"><div><span class="lbl">Leads</span><div class="big">' + cur.length + ' ' + chip(cur.length, prev.length) + '</div></div><div class="pls">' + pills + '</div></div>' + barChart(cur) + '</div>' +
      '<div class="card w4"><h3>Calendario</h3>' + calendar() + '<div class="nx">' + (next.length ? next.map(function (l) {
        var late = new Date(l.next_action_at) < now;
        return '<div class="nr" data-id="' + esc(l.id) + '"><b>' + esc(l.name || '(sin nombre)') + '</b><span class="' + (late ? 'late' : 'sub') + '">' + (late ? 'Vencida · ' : '') + esc(fmt(l.next_action_at)) + '</span></div>';
      }).join('') : '<p class="sub">Sin acciones programadas. Define una "Próxima acción" en el detalle de un lead.</p>') + '</div></div>' +
      '<div class="card w4"><div class="ch" style="margin-bottom:6px"><span class="lbl">Gestión de leads</span><div class="pls">' +
        '<button type="button" class="pl' + (mgmt === 'estado' ? ' on' : '') + '" data-m="estado">Estado</button><button type="button" class="pl' + (mgmt === 'servicio' ? ' on' : '') + '" data-m="servicio">Servicio</button></div></div>' + mItems +
        (stale ? '<p class="warn">' + stale + (stale === 1 ? ' lead nuevo lleva' : ' leads nuevos llevan') + ' más de 24 h sin atender</p>' : '') + '</div>' +
      '<div class="card w4"><h3>Origen</h3>' + donut(countBy(cur, function (l) { return SRC[l.source] || l.source; }).map(function (i) { return { label: i.k, v: i.v }; })) + '</div>' +
      '<div class="card w4"><h3>Campañas: ¿cuáles cierran?</h3>' + (campRows.length ? '<table class="mini"><thead><tr><th>Campaña</th><th>Leads</th><th>Cierre</th></tr></thead><tbody>' +
        campRows.map(function (c) { return '<tr><td>' + esc(c.k) + '</td><td>' + c.n + '</td><td>' + pct(c.w, c.n) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="sub">Sin datos en este periodo.</p>') + '</div>';
  }

  function renderBoard() {
    $('board').innerHTML = STATUSES.map(function (s) {
      var col = leads.filter(function (l) { return l.status === s; }), v = sumV(col);
      return '<div class="col" data-col="' + s + '"><div class="colh"><span class="pill" style="--c:var(--s-' + s + ')"><i></i>' + LABEL[s] + '</span><b>' + col.length + '</b></div>' +
        (v ? '<div class="sub">' + esc(COP.format(v)) + '</div>' : '') +
        col.slice(0, 25).map(function (l) {
          return '<div class="kc" draggable="true" data-id="' + esc(l.id) + '"><div class="nm">' + esc(l.name || '(sin nombre)') + '</div>' +
            '<div class="sub">' + esc(l.company || l.service || l.email || '') + '</div>' +
            '<div class="kmeta"><span>' + esc(SRC[l.source] || l.source) + (l.value_cop ? ' · ' + esc(COP.format(l.value_cop)) : '') + '</span><span>' + ago(l.created_at) + '</span></div></div>';
        }).join('') + (col.length > 25 ? '<div class="sub">+' + (col.length - 25) + ' más en la vista Leads</div>' : '') + '</div>';
    }).join('');
  }

  var TITLES = { dash: 'Resumen', board: 'Pipeline', leads: 'Leads' };
  function setView(v) {
    ['dash', 'board', 'leads'].forEach(function (x) {
      $('v-' + x).classList.toggle('hidden', x !== v);
      $('t-' + x).classList.toggle('on', x === v);
    });
    $('pageTitle').textContent = TITLES[v];
  }
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-v]'); if (b) setView(b.getAttribute('data-v'));
  });
  $('dashGrid').addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-p]'))) { period = +t.getAttribute('data-p'); renderDash(); return; }
    if ((t = e.target.closest('[data-cal]'))) { calOff += +t.getAttribute('data-cal'); renderDash(); return; }
    if ((t = e.target.closest('[data-m]'))) { mgmt = t.getAttribute('data-m'); renderDash(); return; }
    if ((t = e.target.closest('[data-id]'))) openLead(t.getAttribute('data-id'));
  });

  /* Pipeline: arrastrar tarjetas entre columnas (o abrir el lead y cambiar el estado) */
  var dragId = null;
  function clearOver() { $('board').querySelectorAll('.over').forEach(function (c) { c.classList.remove('over'); }); }
  $('board').addEventListener('click', function (e) { var k = e.target.closest('.kc'); if (k) openLead(k.getAttribute('data-id')); });
  $('board').addEventListener('dragstart', function (e) {
    var k = e.target.closest('.kc'); if (!k) return;
    dragId = k.getAttribute('data-id'); e.dataTransfer.setData('text/plain', dragId); k.classList.add('drag');
  });
  $('board').addEventListener('dragend', function () { dragId = null; clearOver(); renderBoard(); });
  $('board').addEventListener('dragover', function (e) {
    var c = e.target.closest('.col'); if (!c || !dragId) return;
    e.preventDefault(); clearOver(); c.classList.add('over');
  });
  $('board').addEventListener('drop', async function (e) {
    var c = e.target.closest('.col'); if (!c || !dragId) return;
    e.preventDefault();
    var id = dragId, st = c.getAttribute('data-col');
    var lead = leads.filter(function (l) { return l.id === id; })[0];
    dragId = null; clearOver();
    if (!lead || lead.status === st) { renderBoard(); return; }
    lead.status = st; renderBoard(); render(); renderDash();
    var r = await sb.from('leads').update({ status: st }).eq('id', id);
    if (r.error) { toast('No se pudo mover'); load(); return; }
    toast('Movido a ' + LABEL[st]);
  });

  boot();
})();
</script>
</body>
</html>
