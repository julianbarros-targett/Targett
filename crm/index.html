<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Targett CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0e; --paper:#faf9f6; --paper-dim:#efeee9;
  --accent:#ff4d2e; --accent-deep:#c4310e;
  --line:rgba(11,11,14,.12); --line-mid:rgba(11,11,14,.26); --muted:rgba(11,11,14,.64);
  --display:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Arial,sans-serif;
  --s-nuevo:#ff4d2e; --s-contactado:#b7791f; --s-propuesta:#2b6cb0; --s-ganado:#2f855a; --s-perdido:#6b6b73;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
.hidden{display:none!important}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;display:grid;gap:14px}
.login h1{font-size:34px;margin-bottom:4px}
.login h1 em{font-style:normal;color:var(--accent)}
.err{color:var(--accent-deep);font-size:13.5px;min-height:20px;margin:0}

.field{display:grid;gap:6px}
.field label{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
input,select,textarea{border:1px solid var(--line-mid);border-radius:8px;padding:10px 12px;background:#fff;width:100%}
textarea{resize:vertical;min-height:70px}
.btn{border:1px solid transparent;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font:600 14px var(--display);cursor:pointer;transition:background .2s}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-mid)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}

/* App */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(250,249,246,.92);backdrop-filter:blur(10px);z-index:20}
header.top h1{font-size:22px}
header.top h1 em{font-style:normal;color:var(--accent)}
.who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
main{padding:clamp(16px,3vw,32px);max-width:1280px;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border-top:1px solid var(--line-mid);margin-bottom:22px}
.stat{padding:16px 16px 14px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;position:relative}
.stat::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.stat.on::after,.stat:hover::after{transform:scaleX(1)}
.stat b{display:block;font:700 30px var(--display);letter-spacing:-.03em}
.stat span{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters input{max-width:280px}
.filters select{width:auto}

table{width:100%;border-collapse:collapse}
th{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-mid)}
td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer;transition:background .2s}
tr.row:hover{background:rgba(11,11,14,.035)}
tr.row:focus-visible{outline-offset:-2px}
.nm{font:600 15px var(--display)}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--display);padding:4px 11px;border:1px solid var(--line-mid);border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c,#999)}
.src{font:600 12px var(--display);color:var(--muted)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(11,11,14,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--paper);z-index:50;overflow:auto;padding:24px;box-shadow:-12px 0 40px rgba(0,0,0,.15);display:grid;gap:20px;align-content:start}
.drawer h2{font-size:28px}
.close{justify-self:end;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted);font:600 11px var(--display);text-transform:uppercase;letter-spacing:.1em;padding-top:3px}
.kv dd{margin:0;word-break:break-word}
.kv a{text-decoration:underline}
.msg{white-space:pre-wrap;background:var(--paper-dim);border-radius:10px;padding:14px;font-size:14.5px}
.sec h3{font-size:16px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line-mid)}
.note{padding:10px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;font-size:14px}
.note small,.ev{color:var(--muted);font-size:12.5px;display:block}
.ev{padding:4px 0}
.statusrow{display:flex;gap:8px;flex-wrap:wrap}
.statusrow button{border:1px solid var(--line-mid);background:#fff;border-radius:999px;padding:6px 14px;font:600 13px var(--display);cursor:pointer}
.statusrow button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:90}

@media (max-width:760px){
  th.hide-m,td.hide-m{display:none}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Configuración: pega aquí los datos de TU proyecto Supabase.
     La anon key es pública por diseño; la protección real es RLS + login. -->

};
</script>

<!-- LOGIN -->
<div class="login" id="login">
  <form id="loginForm">
    <h1>Targett <em>CRM</em></h1>
    <div class="field"><label for="em">Correo</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <h1>Targett <em>CRM</em></h1>
    <div class="who"><span id="who"></span><button class="btn ghost" id="logout" type="button">Salir</button></div>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar nombre, correo, empresa…" aria-label="Buscar">
      <select id="fSource" aria-label="Origen">
        <option value="">Todos los orígenes</option>
        <option value="web">Web</option>
        <option value="meta_ads">Meta Ads</option>
        <option value="manual">Manual</option>
        <option value="otro">Otro</option>
      </select>
      <button class="btn ghost" id="addBtn" type="button">+ Lead manual</button>
      <button class="btn ghost" id="csvBtn" type="button">Exportar CSV</button>
    </div>
    <table>
      <thead><tr>
        <th>Lead</th><th class="hide-m">Interés</th><th>Estado</th><th class="hide-m">Origen</th><th>Fecha</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hidden" id="empty">No hay leads con estos filtros.</div>
  </main>
</div>

<div id="drawerHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var cfg = window.CRM_CONFIG;
  var sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  var STATUSES = ['nuevo', 'contactado', 'propuesta', 'ganado', 'perdido'];
  var LABEL = { nuevo: 'Nuevo', contactado: 'Contactado', propuesta: 'Propuesta', ganado: 'Ganado', perdido: 'Perdido' };
  var SRC = { web: 'Web', meta_ads: 'Meta Ads', manual: 'Manual', otro: 'Otro' };

  var leads = [];
  var fStatus = '';
  var $ = function (id) { return document.getElementById(id); };

  /* Todo dato de un lead es NO confiable (lo escribe cualquiera desde un
     formulario público). Nunca se inserta como HTML: siempre se escapa. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(d) {
    return new Date(d).toLocaleString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function toast(t) {
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = t;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2400);
  }
  function pill(s) {
    return '<span class="pill" style="--c:var(--s-' + esc(s) + ')"><i></i>' + esc(LABEL[s] || s) + '</span>';
  }
  function safeTel(p) { return String(p || '').replace(/[^\d+]/g, ''); }

  /* ---------- Sesión ---------- */
  async function boot() {
    var res = await sb.auth.getSession();
    if (res.data.session) await enter(res.data.session.user);
  }
  async function enter(user) {
    // ¿Es miembro del equipo? Si no, RLS devolverá 0 filas.
    var t = await sb.from('team_members').select('role').eq('user_id', user.id).maybeSingle();
    if (!t.data) {
      await sb.auth.signOut();
      $('loginErr').textContent = 'Tu usuario existe pero no tiene acceso al CRM. Pide que te agreguen al equipo.';
      return;
    }
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('who').textContent = user.email;
    await load();
    sb.channel('leads-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, function (p) {
        if (p.eventType === 'INSERT') toast('Nuevo lead: ' + (p.new.name || p.new.email || 'sin nombre'));
        load();
      }).subscribe();
  }
  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('loginErr').textContent = '';
    var r = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (r.error) { $('loginErr').textContent = 'Correo o contraseña incorrectos.'; return; }
    await enter(r.data.user);
  });
  $('logout').addEventListener('click', async function () { await sb.auth.signOut(); location.reload(); });

  /* ---------- Datos ---------- */
  async function load() {
    var r = await sb.from('leads').select('*').order('created_at', { ascending: false }).limit(1000);
    if (r.error) { toast('Error al cargar leads'); return; }
    leads = r.data;
    render();
  }

  function filtered() {
    var q = $('q').value.trim().toLowerCase();
    var src = $('fSource').value;
    return leads.filter(function (l) {
      if (fStatus && l.status !== fStatus) return false;
      if (src && l.source !== src) return false;
      if (!q) return true;
      return [l.name, l.email, l.company, l.phone, l.message].join(' ').toLowerCase().indexOf(q) > -1;
    });
  }

  function render() {
    // Contadores (clic = filtrar por estado)
    var counts = {};
    STATUSES.forEach(function (s) { counts[s] = 0; });
    leads.forEach(function (l) { counts[l.status] = (counts[l.status] || 0) + 1; });
    var html = '<button class="stat' + (fStatus === '' ? ' on' : '') + '" data-s=""><b>' + leads.length + '</b><span>Todos</span></button>';
    STATUSES.forEach(function (s) {
      html += '<button class="stat' + (fStatus === s ? ' on' : '') + '" data-s="' + s + '"><b>' + counts[s] + '</b><span>' + LABEL[s] + '</span></button>';
    });
    $('stats').innerHTML = html;

    var list = filtered();
    $('empty').classList.toggle('hidden', list.length > 0);
    $('rows').innerHTML = list.map(function (l) {
      return '<tr class="row" tabindex="0" data-id="' + esc(l.id) + '">' +
        '<td><div class="nm">' + esc(l.name || '(sin nombre)') + '</div><div class="sub">' + esc(l.email || l.phone || '') + (l.company ? ' · ' + esc(l.company) : '') + '</div></td>' +
        '<td class="hide-m">' + esc(l.service || '—') + '</td>' +
        '<td>' + pill(l.status) + '</td>' +
        '<td class="hide-m"><span class="src">' + esc(SRC[l.source] || l.source) + '</span></td>' +
        '<td class="sub">' + esc(fmt(l.created_at)) + '</td></tr>';
    }).join('');
  }

  $('stats').addEventListener('click', function (e) {
    var b = e.target.closest('[data-s]'); if (!b) return;
    fStatus = b.getAttribute('data-s'); render();
  });
  $('q').addEventListener('input', render);
  $('fSource').addEventListener('change', render);
  function openRow(e) {
    var tr = e.target.closest('tr.row'); if (!tr) return;
    openLead(tr.getAttribute('data-id'));
  }
  $('rows').addEventListener('click', openRow);
  $('rows').addEventListener('keydown', function (e) { if (e.key === 'Enter') openRow(e); });

  /* ---------- Detalle ---------- */
  function closeDrawer() { $('drawerHost').innerHTML = ''; }

  async function openLead(id) {
    var lead = leads.filter(function (l) { return l.id === id; })[0];
    if (!lead) return;
    var [notes, events] = await Promise.all([
      sb.from('lead_notes').select('*').eq('lead_id', id).order('created_at', { ascending: false }),
      sb.from('lead_events').select('*').eq('lead_id', id).order('created_at', { ascending: false }).limit(30)
    ]);

    var rows = [
      ['Correo', lead.email ? '<a href="mailto:' + esc(lead.email) + '">' + esc(lead.email) + '</a>' : '—'],
      ['Teléfono', lead.phone ? '<a href="tel:' + esc(safeTel(lead.phone)) + '">' + esc(lead.phone) + '</a> · <a target="_blank" rel="noopener noreferrer" href="https://wa.me/' + esc(safeTel(lead.phone).replace('+', '')) + '">WhatsApp</a>' : '—'],
      ['Empresa', esc(lead.company || '—')],
      ['Interés', esc(lead.service || '—')],
      ['Origen', esc(SRC[lead.source] || lead.source) + (lead.lang ? ' · ' + esc(lead.lang.toUpperCase()) : '')],
      ['Campaña', esc([lead.utm_source, lead.utm_medium, lead.utm_campaign].filter(Boolean).join(' / ') || (lead.meta_campaign_id ? 'Meta ' + lead.meta_campaign_id : '—'))],
      ['Página', esc(lead.landing_page || '—')],
      ['Recibido', esc(fmt(lead.created_at))]
    ].map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('');

    var evText = function (ev) {
      if (ev.kind === 'created') return 'Lead creado';
      if (ev.kind === 'status_changed') return 'Estado: ' + (LABEL[ev.detail.from] || ev.detail.from) + ' → ' + (LABEL[ev.detail.to] || ev.detail.to);
      if (ev.kind === 'note_added') return 'Nota agregada';
      return ev.kind;
    };

    $('drawerHost').innerHTML =
      '<div class="scrim" id="scrim"></div>' +
      '<aside class="drawer" role="dialog" aria-modal="true" aria-label="Detalle del lead">' +
      '<button class="close" id="closeD" aria-label="Cerrar">×</button>' +
      '<div><h2>' + esc(lead.name || '(sin nombre)') + '</h2></div>' +
      '<div class="statusrow" id="statusRow">' + STATUSES.map(function (s) {
        return '<button type="button" data-st="' + s + '" class="' + (lead.status === s ? 'on' : '') + '">' + LABEL[s] + '</button>';
      }).join('') + '</div>' +
      '<dl class="kv">' + rows + '</dl>' +
      (lead.message ? '<div class="sec"><h3>Mensaje</h3><div class="msg">' + esc(lead.message) + '</div></div>' : '') +
      '<div class="sec"><h3>Notas</h3>' +
        '<div class="field"><textarea id="noteIn" placeholder="Escribe una nota…" aria-label="Nueva nota"></textarea></div>' +
        '<p><button class="btn" id="noteBtn" type="button">Guardar nota</button></p>' +
        '<div>' + (notes.data || []).map(function (n) {
          return '<div class="note">' + esc(n.body) + '<small>' + esc(fmt(n.created_at)) + '</small></div>';
        }).join('') + '</div></div>' +
      '<div class="sec"><h3>Historial</h3>' + (events.data || []).map(function (ev) {
        return '<span class="ev">' + esc(fmt(ev.created_at)) + ' — ' + esc(evText(ev)) + '</span>';
      }).join('') + '</div>' +
      '</aside>';

    $('scrim').onclick = closeDrawer;
    $('closeD').onclick = closeDrawer;
    $('closeD').focus();
    $('statusRow').onclick = async function (e) {
      var b = e.target.closest('[data-st]'); if (!b) return;
      var r = await sb.from('leads').update({ status: b.getAttribute('data-st') }).eq('id', id);
      if (r.error) { toast('No se pudo actualizar'); return; }
      toast('Estado actualizado');
      await load(); openLead(id);
    };
    $('noteBtn').onclick = async function () {
      var body = $('noteIn').value.trim(); if (!body) return;
      var u = await sb.auth.getUser();
      var r = await sb.from('lead_notes').insert({ lead_id: id, body: body, author_id: u.data.user.id });
      if (r.error) { toast('No se pudo guardar la nota'); return; }
      openLead(id);
    };
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  /* ---------- Lead manual ---------- */
  $('addBtn').addEventListener('click', function () {
    $('drawerHost').innerHTML =
      '<div class="scrim" id="scrim"></div>' +
      '<aside class="drawer" role="dialog" aria-modal="true" aria-label="Nuevo lead">' +
      '<button class="close" id="closeD" aria-label="Cerrar">×</button><h2>Nuevo lead</h2>' +
      '<form id="mForm" style="display:grid;gap:14px">' +
      '<div class="field"><label for="mn">Nombre</label><input id="mn" required></div>' +
      '<div class="field"><label for="me">Correo</label><input id="me" type="email"></div>' +
      '<div class="field"><label for="mp">Teléfono</label><input id="mp"></div>' +
      '<div class="field"><label for="mc">Empresa</label><input id="mc"></div>' +
      '<div class="field"><label for="mm">Mensaje / contexto</label><textarea id="mm"></textarea></div>' +
      '<button class="btn" type="submit">Crear lead</button></form></aside>';
    $('scrim').onclick = closeDrawer; $('closeD').onclick = closeDrawer; $('mn').focus();
    $('mForm').onsubmit = async function (e) {
      e.preventDefault();
      var r = await sb.from('leads').insert({
        name: $('mn').value.trim(), email: $('me').value.trim().toLowerCase() || null,
        phone: $('mp').value.trim() || null, company: $('mc').value.trim() || null,
        message: $('mm').value.trim() || null, source: 'manual'
      });
      if (r.error) { toast('No se pudo crear'); return; }
      closeDrawer(); load();
    };
  });

  /* ---------- Exportar CSV ---------- */
  $('csvBtn').addEventListener('click', function () {
    var cols = ['created_at', 'name', 'email', 'phone', 'company', 'service', 'status', 'source', 'utm_source', 'utm_medium', 'utm_campaign', 'message'];
    // Neutraliza inyección de fórmulas en Excel/Sheets (=, +, -, @).
    var cell = function (v) {
      var s = String(v == null ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var csv = [cols.join(',')].concat(filtered().map(function (l) {
      return cols.map(function (c) { return cell(l[c]); }).join(',');
    })).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'leads-targett.csv';
    a.click();
  });

  boot();
})();
</script>
</body>
</html>
